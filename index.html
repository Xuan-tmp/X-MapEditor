<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>本地地图编辑器</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">M</span>
          <div>
            <h1>地图编辑器</h1>
            <p id="projectStatus">未创建项目</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="newProjectBtn" class="primary">新建项目</button>
          <button id="saveProjectBtn">保存项目</button>
          <button id="openProjectBtn">打开项目</button>
          <button id="exportSingleBtn">导出单 HTML</button>
          <button id="exportFolderBtn">导出文件夹</button>
          <button id="storageSettingsBtn" title="更改项目存储位置">项目位置</button>
          <button id="openProjectsDirBtn" title="打开项目存储文件夹">打开目录</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <div class="panel-head">
            <h2>地图层级</h2>
            <button id="backParentBtn" title="返回上级地图">↑</button>
          </div>
          <div class="storage-summary">
            <span>项目存储位置</span>
            <div id="storagePathDisplay">正在读取…</div>
          </div>
          <div id="mapTree" class="map-tree"></div>
        </aside>

        <section class="stage-area">
          <div class="stage-toolbar">
            <div class="current-path" id="currentPath">请先新建项目</div>
            <div class="tool-group">
              <button id="addInfoBtn" disabled>添加说明</button>
              <button id="addSubmapBtn" disabled>添加子地图入口</button>
              <button id="deleteElementBtn" disabled>删除选中</button>
            </div>
          </div>
          <div class="canvas-wrap">
            <div id="emptyState" class="empty-state">
              <strong>从一张主地图图片开始</strong>
              <span>新建项目后，可以在地图上放置文字、图标、说明和子地图入口。</span>
            </div>
            <div id="mapStage" class="map-stage" aria-label="地图编辑画布"></div>
          </div>
        </section>

        <aside class="inspector">
          <div class="panel-head">
            <h2>属性</h2>
          </div>
          <div id="inspectorEmpty" class="inspector-empty">选中地图上的一个链接以编辑属性。</div>
          <form id="inspectorForm" class="inspector-form hidden">
            <label>
              文本
              <input id="elementText" type="text" maxlength="40">
            </label>
            <fieldset class="icon-picker-field">
              <legend>图标</legend>
              <div class="icon-picker-head">
                <div id="selectedIconPreview" class="selected-icon-preview" aria-label="当前图标"></div>
                <button id="uploadIconBtn" type="button">上传图标</button>
              </div>
              <div id="iconLibrary" class="icon-library" aria-label="项目图标栏"></div>
              <div class="icon-actions">
                <button id="deleteIconBtn" type="button" class="danger-text">删除当前自定义图标</button>
              </div>
            </fieldset>
            <label>
              图标尺寸（屏幕像素）
              <input id="elementIconSize" type="number" min="12" max="64" step="1">
            </label>
            <label>
              图标位置
              <select id="elementIconPlacement">
                <option value="left">文字左侧</option>
                <option value="bottom">文字下侧</option>
              </select>
            </label>
            <label>
              悬浮说明
              <textarea id="elementDescription" rows="4" maxlength="180"></textarea>
            </label>
            <fieldset class="appearance-field">
              <legend>文字与外观</legend>
              <label>
                外观预设
                <select id="elementStylePreset">
                  <option value="card">卡片</option>
                  <option value="simple">简洁</option>
                  <option value="text">纯文字</option>
                  <option value="icon">仅图标</option>
                  <option value="custom">自定义</option>
                </select>
              </label>
              <label class="check-row"><input id="elementShowText" type="checkbox"> 显示文字</label>
              <div class="position-grid">
                <label>字号（像素）<input id="elementFontSize" type="number" min="10" max="48" step="1"></label>
                <label>文字颜色<input id="elementTextColor" type="color"></label>
              </div>
              <label class="check-row"><input id="elementTextShadow" type="checkbox"> 显示文字阴影</label>
              <label class="check-row"><input id="elementShowBackground" type="checkbox"> 显示背景</label>
              <div class="position-grid">
                <label>背景颜色<input id="elementBackgroundColor" type="color"></label>
                <label>背景透明度（%）<input id="elementBackgroundOpacity" type="number" min="0" max="100" step="1"></label>
              </div>
              <label class="check-row"><input id="elementShowBorder" type="checkbox"> 显示边框</label>
              <label>边框颜色<input id="elementBorderColor" type="color"></label>
              <label class="check-row"><input id="elementShowShadow" type="checkbox"> 显示容器阴影</label>
            </fieldset>
            <fieldset class="appearance-field">
              <legend>悬停外轮廓</legend>
              <label class="check-row"><input id="elementShowHoverOutline" type="checkbox"> 鼠标悬停时显示</label>
              <div class="position-grid">
                <label>轮廓颜色<input id="elementHoverOutlineColor" type="color"></label>
                <label>透明度（%）<input id="elementHoverOutlineOpacity" type="number" min="0" max="100" step="1"></label>
              </div>
              <div class="position-grid">
                <label>宽度（像素）<input id="elementHoverOutlineWidth" type="number" min="1" max="6" step="1"></label>
                <label>间距（像素）<input id="elementHoverOutlineOffset" type="number" min="0" max="8" step="1"></label>
              </div>
              <label>
                轮廓样式
                <select id="elementHoverOutlineStyle">
                  <option value="solid">实线</option>
                  <option value="dashed">虚线</option>
                  <option value="dotted">点线</option>
                </select>
              </label>
              <div id="hoverOutlinePreview" class="hover-outline-preview" tabindex="0">将鼠标移到这里预览</div>
            </fieldset>
            <label>
              链接类型
              <select id="elementKind">
                <option value="info">仅显示说明</option>
                <option value="submap">跳转到子地图</option>
              </select>
            </label>
            <div id="submapControls" class="submap-controls">
              <label>
                子地图名称
                <input id="submapName" type="text" maxlength="40">
              </label>
              <label>
                子地图图片
                <input id="submapImage" type="file" accept="image/*">
              </label>
              <button id="goSubmapBtn" type="button">进入子地图</button>
            </div>
            <div class="position-grid">
              <label>
                X
                <input id="elementX" type="number" min="0" step="0.01">
              </label>
              <label>
                Y
                <input id="elementY" type="number" min="0" step="0.01">
              </label>
            </div>
          </form>
        </aside>
      </main>
    </div>

    <input id="mainImageInput" class="hidden" type="file" accept="image/*">
    <input id="openProjectInput" class="hidden" type="file" accept="application/json,.json">
    <input id="iconImageInput" class="hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif">

    <template id="treeNodeTemplate">
      <button class="tree-node" type="button"></button>
    </template>

    <script src="app.js"></script>
  </body>
</html>
